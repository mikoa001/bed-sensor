; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.htmls
;
; NB! When uploading over the air (OTA), ensure to refresh the upload command in powershell to exclude "--upload-port COM3" or similar.

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
upload_protocol = espota ; alt. esptool for direct serial upload
upload_port = 192.168.1.86 ; alt. COM-port for direct serial upload
lib_deps = knolleary/PubSubClient@^2.8.0

